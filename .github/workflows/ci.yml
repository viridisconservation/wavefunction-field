# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  push:
    branches: ["main", "codex/**", "claude/**"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check . && python -m ruff format --check .
      - run: python -m mypy --strict src/wavefunction_field/core src/wavefunction_field/identity
      - run: python -m pytest -q --hypothesis-profile=ci
      - run: python scripts/check_traceability.py
      - run: python scripts/check_deps.py
      - run: python scripts/check_claims.py
      - run: python scripts/check_headers.py
      - run: python scripts/check_core_purity.py
      - run: python scripts/check_prereg_lock.py
      - run: wf-field --help && wf-agent --help && wf-sim --help

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The organization Action requires a license; use the official CLI image.
      - name: Scan full history with Gitleaks
        run: >-
          docker run --rm --network none
          --volume "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --exit-code 1 /repo

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check DCO over the complete PR commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          revision = f"{os.environ['BASE_SHA']}..{os.environ['HEAD_SHA']}"
          commits = subprocess.check_output(
              ["git", "rev-list", revision], text=True
          ).splitlines()
          failures = []
          for commit in commits:
              message = subprocess.check_output(
                  ["git", "show", "-s", "--format=%B", commit], text=True
              )
              if not re.search(r"(?m)^Signed-off-by: .+ <[^<>\s]+@[^<>\s]+>$", message):
                  failures.append(commit)
          if failures:
              raise SystemExit("Missing DCO sign-off: " + ", ".join(failures))
          print(f"DCO: PASS ({len(commits)} commits)")
          PY
