# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wavefunction-field"
version = "0.1.0a3"
description = "Pre-alpha reference implementation of the Wavefunction Field Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Justin Hart, Viridis LLC"}]
dependencies = ["mcp>=1.25,<3", "cryptography>=42", "jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
wf-field = "wavefunction_field.mcp.field_server:main"
wf-agent = "wavefunction_field.mcp.agent_server:main"
wf-sim = "wavefunction_field.sim.cli:main"
wavefunction-field = "wavefunction_field.mcp.agent_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wavefunction_field"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-config --strict-markers -m 'not bench'"
markers = ["bench: local micro-benchmarks excluded from CI"]
